{% comment %}
  HTML half of the reset email. Mail clients strip <style> blocks and have never
  supported CSS custom properties, so this is the one place in BitGigs that
  inlines literal colours instead of using theme tokens — the accent is passed
  in from UserSettings by the view (extra_email_context) so it still follows the
  operator's chosen colour rather than being hardcoded.
{% endcomment %}<div style="font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; font-size: 15px; line-height: 1.6; color: #212529; max-width: 520px;">

  <p style="margin: 0 0 16px;">
    Hi{% if user.first_name %} {{ user.first_name }}{% endif %},
  </p>

  <p style="margin: 0 0 16px;">
    Someone asked to reset the password for your BitGigs account
    (<strong>{{ user.get_username }}</strong>). If that was you, use the button below
    to choose a new one.
  </p>

  <p style="margin: 0 0 24px;">
    <a href="{{ protocol }}://{{ domain }}{% url 'password_reset_confirm' uidb64=uid token=token %}"
       style="display: inline-block; padding: 10px 20px; border-radius: 8px;
              background: {{ accent_color }}; color: #ffffff; text-decoration: none;
              font-weight: 600;">
      Choose a new password
    </a>
  </p>

  <p style="margin: 0 0 16px; color: #6c757d; font-size: 13px;">
    The link is valid for two hours and can only be used once. If the button
    doesn't work, copy this address into your browser:<br>
    <span style="word-break: break-all;">{{ protocol }}://{{ domain }}{% url 'password_reset_confirm' uidb64=uid token=token %}</span>
  </p>

  <p style="margin: 0; color: #6c757d; font-size: 13px;">
    If you didn't ask for this, you can ignore this email — your password stays as it is.
  </p>

</div>
