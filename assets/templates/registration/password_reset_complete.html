{% extends "base.html" %}
{% block title %}Password changed — BitGigs{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-12 col-sm-8 col-md-6 col-lg-4">
    <div class="card border-0 shadow-sm mt-5">
      <div class="card-body p-4 text-center">
        <h1 class="h4 mb-3"><i class="bi bi-check-circle me-2"></i>Password changed</h1>
        <p class="form-text">Your new password is ready. Sign in with it below.</p>
        <a class="btn btn-primary w-100" href="{% url 'login' %}">Log in</a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
